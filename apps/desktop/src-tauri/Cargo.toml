[package]
name = "kiirmarge"
version = "0.1.0"
description = "Kiirmärge — kiire märkme tegemine globaalse kiirklahviga"
authors = ["Lauri Liikane"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kiirmarge_lib"
# Ainult desktop. staticlib/cdylib on vajalikud mobiili jaoks (E10) ja need teevad
# debug-ehituse mitusada MB suuremaks. Kui mobiil tuleb, lisa need tagasi.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GitHubi Issue'd: HTTP + token Windowsi mandaadihoidlas (Credential Manager).
ureq = { version = "2", features = ["json"] }
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.55"

[profile.dev]
# Väiksem ehitustulemus — C: ketas on kitsas (täielik debug-info võttis ~7 GB).
debug = "line-tables-only"
